name: Cloudflare Free Worker CI

on:
  push:
    branches:
      - feature/chinese-name-lead-hunter
    paths:
      - "cloudflare/**"
      - "frontend/**"
      - ".github/workflows/cloudflare-free-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/**"
      - "frontend/**"
      - ".github/workflows/cloudflare-free-ci.yml"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Worker dependencies
        run: npm install
      - name: Generate Cloudflare bindings
        run: npx wrangler types
      - name: Type-check Worker
        run: npx tsc --noEmit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
