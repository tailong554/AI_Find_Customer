name: Deploy AI Hunter to Cloudflare Free

on:
  workflow_dispatch:
  push:
    branches:
      - feature/chinese-name-lead-hunter
    paths:
      - ".github/workflows/deploy-cloudflare-free.yml"
      - "cloudflare/**"
      - "frontend/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chinese-name-lead-hunter
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1)
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install
      - name: Type-check Worker
        working-directory: cloudflare
        run: npx tsc --noEmit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@4.57.1
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload optional runtime secrets
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          REPLY_TO_EMAIL: ${{ secrets.REPLY_TO_EMAIL }}
          PUBLIC_APP_BASE_URL: ${{ secrets.PUBLIC_APP_BASE_URL }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ORDER_WEBHOOK_SECRET: ${{ secrets.ORDER_WEBHOOK_SECRET }}
        run: |
          for name in SERPER_API_KEY AGNES_API_KEY RESEND_API_KEY FROM_EMAIL REPLY_TO_EMAIL PUBLIC_APP_BASE_URL ACCESS_TEAM_DOMAIN ACCESS_AUD ADMIN_EMAIL ORDER_WEBHOOK_SECRET; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.toml
            fi
          done
      - name: Apply D1 migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply 中文名称线索 --remote --config wrangler.toml
      - name: Deploy Worker and static frontend
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
