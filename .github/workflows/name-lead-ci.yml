name: Chinese Name Lead Hunter CI

on:
  push:
    branches:
      - feature/chinese-name-lead-hunter
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q api social_sources
      - name: Run Chinese-name lead tests
        run: pytest -q tests/test_api/test_name_lead_routes.py tests/test_api/test_public_name_funnel_routes.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Rollup Linux native optional package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@4.57.1
      - name: TypeScript check and production build
        run: npm run build
